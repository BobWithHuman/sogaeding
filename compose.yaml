name: sogaeding-team

x-app: &app
  image: ${SOGAEDING_TEAM_IMAGE:-with-human-engine:local}
  user: "10001:10001"
  working_dir: /product
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=128m,mode=1777"]
  pids_limit: 128
  mem_limit: 512m
  environment: &environment
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /product/src
    CONTRACT_DIR: /product/contracts
    HOOKGW_RUNTIME: /runtime
    RUNTIME_DIR: /runtime
    WITH_HUMAN_CONTAINER_BOUNDARY: loopback-published
  networks: [protected]

services:
  control:
    <<: *app
    command: [python, -m, app.transparent.server]
    ports: ["127.0.0.1:${SOGAEDING_CONTROL_PORT:-8130}:8030"]
    networks: [protected, ingress]
    environment:
      <<: *environment
      HOOKGW_PDP: JEV
      HOOKGW_JEV_PROFILE: gate-6
      HOOKGW_REQUIRE_JEV: "1"
      JEV_POLICY_FILE: /jev-config/policy.json
      WITH_HUMAN_SESSION_TTL_SECONDS: "${WITH_HUMAN_SESSION_TTL_SECONDS:-86400}"
      WITH_HUMAN_HISTORY_TTL_SECONDS: "${WITH_HUMAN_HISTORY_TTL_SECONDS:-604800}"
      WITH_HUMAN_DELETION_EVIDENCE_TTL_SECONDS: "${WITH_HUMAN_DELETION_EVIDENCE_TTL_SECONDS:-2592000}"
    volumes:
      - ./src:/product/src:ro
      - ./docs/mvp/contracts:/product/contracts:ro
      - type: bind
        source: ${SOGAEDING_JEV_KEY_FILE:-./runtime/jev/jev.api-key}
        target: /jev-key/jev.api-key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${SOGAEDING_JEV_POLICY_FILE:-./runtime/jev/policy.json}
        target: /jev-config/policy.json
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: team-runtime
        target: /jev-budget
        volume: {subpath: "artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}/jev-budget"}
      - type: volume
        source: team-runtime
        target: /runtime
        read_only: true
        volume: {subpath: "artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}/control"}
      - type: volume
        source: team-runtime
        target: /data
        volume: {subpath: "artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}/control-data"}
  upstream:
    <<: *app
    command: [python, -m, app.transparent.upstream]
    volumes:
      - ./src:/product/src:ro
      - ./docs/mvp/contracts:/product/contracts:ro
      - type: volume
        source: team-runtime
        target: /runtime
        read_only: true
        volume: {subpath: "artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}/upstream"}
      - type: volume
        source: team-runtime
        target: /data
        volume: {subpath: "artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}/upstream-data"}
      - type: volume
        source: team-runtime
        target: /files
        volume: {subpath: "artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}/workspace"}
  gateway:
    image: cr.agentgateway.dev/agentgateway@sha256:89b5d4c66dc59049d70011910ea428afafb40a238779c2fc9f42a66cecee19da
    command: [-f, /config/config.yaml]
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    pids_limit: 128
    mem_limit: 512m
    ports: ["127.0.0.1:${SOGAEDING_GATEWAY_PORT:-8140}:8040"]
    networks: [protected, ingress]
    volumes:
      - ./agentgateway:/config:ro
      - type: volume
        source: team-runtime
        target: /runtime
        read_only: true
        volume: {subpath: "artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}/gateway"}
    depends_on: [control, upstream]
  dashboard:
    <<: *app
    profiles: [dashboard]
    networks: [protected, ingress]
    command: [python, -m, app.dashboard_local, --credentials, /dashboard-credentials, --engine-url, 'https://control:8030', --port, '8150']
    ports: ["127.0.0.1:${SOGAEDING_DASHBOARD_PORT:-8150}:8150"]
    volumes:
      - ./src:/product/src:ro
      - type: volume
        source: team-runtime
        target: /dashboard-credentials
        read_only: true
        volume: {subpath: "artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}/host"}
  check:
    <<: *app
    profiles: [verification]
    command: [python, /tools/team_runtime.py, check, "/team/artifacts/team-dev/${SOGAEDING_RUNTIME_NAME:-default}"]
    volumes:
      - ./tools:/tools:ro
      - team-runtime:/team:ro

volumes:
  team-runtime:
    external: true
    name: "${SOGAEDING_TEAM_VOLUME:?Run scripts/team_dev.ps1 prepare first}"

networks:
  protected:
    internal: true
    ipam: {config: [{subnet: "${SOGAEDING_PROTECTED_SUBNET:-10.253.240.0/24}"}]}
  ingress:
    ipam: {config: [{subnet: "${SOGAEDING_INGRESS_SUBNET:-10.253.241.0/24}"}]}
