# Offline rules-first mode. No TypeSafe key/usage policy, no paid inference.
# Use with base only; never combine this switch with the historical LIVE override.
name: with-human-jev-rules
services:
  control:
    ports: !override ["127.0.0.1:8032:8030"]
    environment:
      HOOKGW_PDP: JEV
      HOOKGW_USER_LIVE: "0"
      JEV_POLICY_FILE: /jev-config/policy.json
    volumes:
      - jev-control:/data
      - type: bind
        source: ./fixtures/hookgw/jev-disabled-marker.txt
        target: /runtime/judge.api-key
        read_only: true
        bind: {create_host_path: false}
  upstream:
    volumes: ["jev-upstream:/data"]
  agentgateway:
    ports: !override ["127.0.0.1:8042:8040"]
volumes:
  jev-control: {}
  jev-upstream: {}
# The absent file yields disabled settings. No key, budget volume or allowance is created.
# User LIVE requires an explicitly reviewed TypeSafe policy/key/ledger mount; see SPEC5.
# This public sentinel shadows only the old empty OpenAI mountpoint for masking.
# It is not an API credential; TypeSafe reads /jev-key/jev.api-key exclusively.
