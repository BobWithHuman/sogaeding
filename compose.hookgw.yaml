name: with-human-hookgw
x-python: &python
  image: with-human-dev:local
  working_dir: /product
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 128
  mem_limit: 512m
  environment: &env
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /product/src
    CONTRACT_DIR: /product/contracts
    RUNTIME_DIR: /runtime
    HOOKGW_RUNTIME: /runtime
  networks: [protected]
services:
  control:
    <<: *python
    command: [python, -m, app.transparent.server]
    ports: ["127.0.0.1:${HOOKGW_CONTROL_PORT:-8030}:8030"]
    networks: [protected, ingress]
    volumes:
      - hookgw-product:/product:ro
      - hookgw-control-runtime:/runtime:ro
      - hookgw-control:/data
  upstream:
    <<: *python
    command: [python, -m, app.transparent.upstream]
    volumes:
      - hookgw-product:/product:ro
      - hookgw-upstream-runtime:/runtime:ro
      - ./:/files
      - hookgw-upstream:/data
  agentgateway:
    image: cr.agentgateway.dev/agentgateway@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    command: [-f, /config/config.yaml]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    pids_limit: 128
    mem_limit: 512m
    ports: ["127.0.0.1:${HOOKGW_GATEWAY_PORT:-8040}:8040"]
    networks: [protected, ingress]
    volumes:
      - ./agentgateway:/config:ro
      - hookgw-gateway-runtime:/runtime:ro
    depends_on: [control, upstream]
networks:
  protected: {internal: true}
  ingress: {}
volumes:
  hookgw-control:
  hookgw-upstream:
  hookgw-product: {external: true, name: with-human-hookgw-runtime-product}
  hookgw-control-runtime: {external: true, name: with-human-hookgw-runtime-control}
  hookgw-gateway-runtime: {external: true, name: with-human-hookgw-runtime-gateway}
  hookgw-upstream-runtime: {external: true, name: with-human-hookgw-runtime-upstream}
