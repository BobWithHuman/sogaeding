# Isolated V5 revision; no legacy service/budget replacement.
name: with-human-mvp-demo-core-auto-v5p1
x-python: &python
  image: ${MVP_DEMO_IMAGE:?Run scripts/mvp_demo.ps1 prepare first}
  pull_policy: never
  working_dir: /product
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 128
  mem_limit: 512m
  environment: &env
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /product/src
    CONTRACT_DIR: /product/contracts
    RUNTIME_DIR: /runtime
    HOOKGW_RUNTIME: /runtime
  networks: [protected]
services:
  control:
    <<: *python
    command: [python, -m, app.transparent.server]
    ports: ["127.0.0.1:8037:8030"]
    networks: [protected, ingress]
    environment:
      <<: *env
      HOOKGW_PDP: JEV
      HOOKGW_USER_LIVE: "0"
      HOOKGW_DEMO_VIEWER: "1"
      HOOKGW_DEMO_DISPATCH: "1"
      HOOKGW_JEV_PROFILE: behavior_v5p1
      JEV_POLICY_FILE: /jev-config/policy.json
    volumes:
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/bundle:/product:ro
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/control:/runtime:ro
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/control-data:/data
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/config:/jev-config:ro
      - ./artifacts/runtime-jev-eval/key:/jev-key:ro
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/ledger:/jev-budget
  upstream:
    <<: *python
    command: [python, -m, app.transparent.upstream]
    volumes:
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/bundle:/product:ro
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/upstream:/runtime:ro
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/workspace:/files
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/upstream-data:/data
  agentgateway:
    image: cr.agentgateway.dev/agentgateway@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    pull_policy: never
    command: [-f, /config/config.yaml]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    pids_limit: 128
    mem_limit: 512m
    ports: ["127.0.0.1:8047:8040"]
    networks: [protected, ingress]
    volumes:
      - ./agentgateway:/config:ro
      - ./artifacts/runtime-mvp-demo/revisions/core-auto-v5p1/gateway:/runtime:ro
    depends_on: [control, upstream]
networks:
  protected:
    internal: true
    ipam: {config: [{subnet: 10.233.65.0/24}]}
  ingress:
    ipam: {config: [{subnet: 10.233.66.0/24}]}
