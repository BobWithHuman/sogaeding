[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/product"]
addopts = "-ra"

# Product acceptance tests join the suite when app implementation exists.
# Passing the harness suite does not mark AC/NT/AT product tests as passed.
